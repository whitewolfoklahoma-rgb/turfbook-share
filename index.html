<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TurfBook — Lawn Care Season Program & Route Book</title>
<style>
  :root{
    --green:#2e7d32; --green-d:#1b5e20; --lime:#8bc34a; --ink:#1c2420;
    --paper:#f7f9f4; --card:#ffffff; --line:#d8e0d2; --mut:#5d6d60;
    --red:#b3261e; --amber:#e65100; --amber-bg:#fff3e0; --red-bg:#fdecea;
    --green-bg:#e8f5e9; --blue:#1565c0; --blue-bg:#e3f2fd;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45}
  header{background:linear-gradient(135deg,var(--green-d),var(--green));color:#fff;padding:14px 16px 10px}
  header h1{margin:0;font-size:22px;letter-spacing:.3px}
  header .sub{opacity:.9;font-size:13px;margin-top:2px}
  header .seasonline{font-size:12px;opacity:.85;margin-top:4px}
  nav{display:flex;flex-wrap:wrap;gap:6px;background:var(--green-d);padding:8px 10px;position:sticky;top:0;z-index:20}
  nav button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:7px 13px;font-size:13.5px;cursor:pointer;min-height:36px}
  nav button.active{background:#fff;color:var(--green-d);font-weight:700}
  main{max-width:1080px;margin:0 auto;padding:14px 12px 60px}
  .tab{display:none}
  .tab.active{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:24px;font-weight:700;margin-top:2px}
  .card .v small{font-size:13px;font-weight:400;color:var(--mut)}
  .card.alert{border-color:var(--red);background:var(--red-bg)}
  .card.warn{border-color:var(--amber);background:var(--amber-bg)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .panel h2{margin:0 0 8px;font-size:17px}
  .panel h3{margin:14px 0 6px;font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:14px}
section.tab table{display:block;overflow-x:auto;max-width:100%}
  th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:600}
  .pill.done{background:var(--green-bg);color:var(--green-d)}
  .pill.due{background:var(--amber-bg);color:var(--amber)}
  .pill.overdue{background:var(--red-bg);color:var(--red)}
  .pill.upcoming{background:#eceff1;color:#455a64}
  .pill.info{background:var(--blue-bg);color:var(--blue)}
  form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  label{font-size:12.5px;color:var(--mut);display:block;margin-bottom:3px}
  input,select,textarea{width:100%;padding:9px;border:1px solid #b9c6b4;border-radius:7px;font-size:14.5px;background:#fff;min-height:40px}
  textarea{min-height:64px}
  .btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14.5px;cursor:pointer;min-height:42px;font-weight:600}
  .btn:hover{background:var(--green-d)}
  .btn.secondary{background:#fff;color:var(--green-d);border:1.5px solid var(--green)}
  .btn.small{padding:6px 11px;font-size:13px;min-height:34px;min-height:40px;}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .muted{color:var(--mut);font-size:13px}
  .empty{padding:18px;text-align:center;color:var(--mut)}
  .profit-pos{color:var(--green-d);font-weight:700}
  .profit-neg{color:var(--red);font-weight:700}
  .flexline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .notice{background:var(--blue-bg);border:1px solid #bbdefb;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
  .hidden{display:none!important}
  #printArea{display:none}
  @media (max-width:560px){
    header h1{font-size:19px}
    th,td{padding:6px 5px;font-size:13px}
    .card .v{font-size:20px}
  }
  @media print{
    body>*{display:none!important}
    #printArea{display:block!important;font-size:12.5px;color:#000}
    #printArea table{font-size:12px}
    #printArea h1{font-size:19px;margin:0 0 2px}
    #printArea h2{font-size:15px;margin:14px 0 4px}
    #printArea .sig{margin-top:28px;border-top:1px solid #000;padding-top:4px;width:55%}
  }
</style>
</head>

/* ============================== TurfBook ==============================
   Single-file offline season book for lawn care operators:
   program rounds, application records, mowing routes, per-property

var LS_KEY = "turfbook_v1";

/* ---------- utilities ---------- */
function uid(){ return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function nonNeg(v){ var n = num(v); return n < 0 ? 0 : n; }
function money(n){
  var neg = n < 0; n = Math.abs(Math.round(n * 100) / 100);
  var parts = n.toFixed(2).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-$" : "$") + parts.join(".");
}
function todayStr(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function fmtDate(s){
  if(!s) return "—";
  var p = String(s).split("-"); if(p.length !== 3) return esc(s);
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0];
}
function daysBetween(a, b){ // whole days from a to b (date strings)
  var da = new Date(a + "T12:00:00"), db = new Date(b + "T12:00:00");
  return Math.round((db - da) / 86400000);
}

/* ---------- state ---------- */
var state = null;
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ state = JSON.parse(raw); if(state && state.settings && state.properties) return; }
  }catch(e){}
  state = demoData(); save();
}
function propById(id){ for(var i=0;i<state.properties.length;i++) if(state.properties[i].id===id) return state.properties[i]; return null; }
function productById(id){ for(var i=0;i<state.products.length;i++) if(state.products[i].id===id) return state.products[i]; return null; }
function roundByN(n){ for(var i=0;i<state.rounds.length;i++) if(state.rounds[i].n===n) return state.rounds[i]; return null; }
function isProgram(p){ return p.type === "program" || p.type === "both"; }
function isMowing(p){ return p.type === "mowing" || p.type === "both"; }

/* ================= calculation engine ================= */
/* Product used for one application: rate is per 1,000 sq ft. */
function appProductUsed(app, prop){
  if(!prop) return 0;
  return nonNeg(app.rate) * (nonNeg(prop.sqft) / 1000);
}
function appProductCost(app, prop){
  var prod = productById(app.productId);
  if(!prod) return 0;
  return appProductUsed(app, prop) * nonNeg(prod.cost);
}
function visitLaborCost(minutes){
  return (nonNeg(minutes) / 60) * nonNeg(state.settings.laborRate);
}
function visitDriveCost(){
  return (nonNeg(state.settings.driveMinutes) / 60) * nonNeg(state.settings.laborRate);
}
function hasApplication(propId, roundN){
  for(var i=0;i<state.applications.length;i++)
    if(state.applications[i].propId===propId && state.applications[i].round===roundN) return state.applications[i];
  return null;
}
/* Status of one round for one property: done | overdue | due | upcoming */
function roundStatus(prop, round, today){
  today = today || todayStr();
  if(hasApplication(prop.id, round.n)) return "done";
  if(today > round.end) return "overdue";
  if(today >= round.start) return "due";
  return "upcoming";
}
/* Due list: every program property × round that is due now or overdue. */
function dueItems(today){
  today = today || todayStr();
  var out = [];
  state.properties.forEach(function(p){
    if(!isProgram(p) || p.renewal === "not-renewed") return;
    state.rounds.forEach(function(r){
      var st = roundStatus(p, r, today);
      if(st === "due" || st === "overdue") out.push({prop:p, round:r, status:st});
    });
  });
  out.sort(function(a,b){
    if(a.status !== b.status) return a.status === "overdue" ? -1 : 1;
    return a.round.end < b.round.end ? -1 : 1;
  });
  return out;
}
/* Per-property season P&L. Revenue counts completed work only:
   rounds with an application logged, and mows logged. */
function propStats(prop){
  var apps = state.applications.filter(function(a){ return a.propId===prop.id; });
  var mows = state.mows.filter(function(m){ return m.propId===prop.id; });
  var productCost = 0, laborMin = 0, i;
  for(i=0;i<apps.length;i++){ productCost += appProductCost(apps[i], prop); laborMin += nonNeg(apps[i].minutes); }
  for(i=0;i<mows.length;i++){ laborMin += nonNeg(mows[i].minutes); }
  var visits = apps.length + mows.length;
  var laborCost = (laborMin/60) * nonNeg(state.settings.laborRate);
  var driveCost = visits * visitDriveCost();
  var revenue = apps.length * nonNeg(prop.priceRound) + mows.length * nonNeg(prop.priceMow);
  var cost = productCost + laborCost + driveCost;
  return {
    roundsDone: apps.length, mowsDone: mows.length, visits: visits,
    revenue: revenue, productCost: productCost, laborCost: laborCost,
    driveCost: driveCost, cost: cost, profit: revenue - cost,
    margin: revenue > 0 ? ((revenue - cost) / revenue) * 100 : 0
  };
}
function routeStats(route){
  var props = state.properties.filter(function(p){ return p.route === route; });
  var t = {props:0, revenue:0, cost:0, profit:0, visits:0};
  props.forEach(function(p){ var s = propStats(p); t.props++; t.revenue+=s.revenue; t.cost+=s.cost; t.profit+=s.profit; t.visits+=s.visits; });
  t.revPerVisit = t.visits > 0 ? t.revenue / t.visits : 0;
  return t;
}
function allRoutes(){
  var seen = {}, out = [];
  state.properties.forEach(function(p){ if(!seen[p.route]){ seen[p.route]=1; out.push(p.route); } });
  return out.sort();
}
/* Season program contract value + prepay math */
function seasonContractValue(prop){ return nonNeg(prop.priceRound) * state.rounds.length; }
function prepayPrice(prop){
  var v = seasonContractValue(prop);
  return v - v * (nonNeg(prop.prepayPct) / 100);
}
function renewalList(){
  return state.properties.filter(function(p){ return isProgram(p) && p.renewal !== "renewed" && p.renewal !== "na"; });
}

      html += "<tr><td><strong>" + esc(d.prop.name) + "</strong><br><span class='muted'>" + esc(d.prop.address) + " · " + esc(d.prop.route) + "</span></td>"
        + "<td>" + esc(d.round.name) + "</td><td>" + fmtDate(d.round.start) + " – " + fmtDate(d.round.end) + "</td>"
        + "<td><span class='pill " + d.status + "'>" + d.status.toUpperCase() + "</span></td></tr>";
    });

  if(!routes.length) html += '<div class="empty">No routes yet — add a property to get started.</div>';
  else {
    html += '<table><tr><th>Route</th><th class="num">Stops</th><th class="num">Visits</th><th class="num">Revenue</th><th class="num">Cost</th><th class="num">Profit</th><th class="num">Rev / visit</th></tr>';
    routes.forEach(function(r){

    });

  el.innerHTML = html;
}

    (sub ? ' <small>' + esc(sub) + '</small>' : "") + "</div></div>";

function field(label, control){ return "<div><label>" + esc(label) + "</label>" + control + "</div>"; }
function setV(id, v){ var n = document.getElementById(id); if(n) n.value = (v == null ? "" : v); }
function getV(id){ var n = document.getElementById(id); return n ? n.value.trim() : ""; }
function saveProperty(e){
  e.preventDefault();
  var name = getV("pName");
  if(!name){ alert("Give the property a name."); return; }
  var data = {
    name: name, address: getV("pAddress"), contact: getV("pContact"), phone: getV("pPhone"),
    sqft: nonNeg(getV("pSqft")), route: getV("pRoute") || "Main", type: getV("pType"),
    priceRound: nonNeg(getV("pPriceRound")), priceMow: nonNeg(getV("pPriceMow")),
    renewal: getV("pRenewal"), prepayPct: Math.min(100, nonNeg(getV("pPrepayPct"))),
    prepaid: getV("pPrepaid") === "yes", notes: getV("pNotes")
  };
  if(editingPropId){
    var p = propById(editingPropId);
    if(p){ for(var k in data) p[k] = data[k]; }
    editingPropId = null;
  } else {
    data.id = uid();
    state.properties.push(data);
  }
  save(); render();
}
function editProperty(id){ editingPropId = id; render(); var f=document.getElementById("propFormPanel"); if(f) f.scrollIntoView({behavior:"smooth"}); }
function cancelEditProp(){ editingPropId = null; render(); }
function deleteProperty(id){
  var p = propById(id); if(!p) return;
  if(!confirm("Delete " + p.name + " and all its application/mowing records? This cannot be undone.")) return;
  state.properties = state.properties.filter(function(x){ return x.id !== id; });
  state.applications = state.applications.filter(function(x){ return x.propId !== id; });
  state.mows = state.mows.filter(function(x){ return x.propId !== id; });
  if(editingPropId === id) editingPropId = null;
  save(); render();
}

function saveSettings(e){
  e.preventDefault();
  var s = state.settings;
  s.company = getV("sCompany") || s.company; s.phone = getV("sPhone"); s.email = getV("sEmail");
  s.laborRate = nonNeg(getV("sLabor")); s.appMinutes = nonNeg(getV("sAppMin"));
  s.mowMinutes = nonNeg(getV("sMowMin")); s.driveMinutes = nonNeg(getV("sDrive"));
  var y = parseInt(getV("sYear"),10); if(y >= 2000 && y <= 2100) s.seasonYear = y;
  save(); render();
}
function addProduct(e){
  e.preventDefault();
  var name = getV("npName"); if(!name){ alert("Name the product."); return; }
  state.products.push({ id: uid(), name: name, unit: getV("npUnit") || "lb", cost: nonNeg(getV("npCost")) });
  save(); render();
}
function deleteProduct(id){
  var used = state.applications.some(function(a){ return a.productId === id; });
  if(used && !confirm("This product appears in application records. Deleting it leaves those records without a product cost. Delete anyway?")) return;
  if(!used && !confirm("Delete this product?")) return;
  state.products = state.products.filter(function(p){ return p.id !== id; });
  save(); render();
}
function saveRound(i){
  var r = state.rounds[i]; if(!r) return;
  var name = getV("rdName" + i), start = getV("rdStart" + i), end = getV("rdEnd" + i), work = getV("rdWork" + i);
  var newStart = start || r.start, newEnd = end || r.end;
  if(newEnd < newStart){ alert("Window end is before window start — fix the dates."); return; }
  if(name) r.name = name;
  r.start = newStart; r.end = newEnd;
  r.work = work;
  save(); render();
}
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "turfbook-backup-" + todayStr() + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function importData(ev){
  var file = ev.target.files && ev.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || !data.settings || !Array.isArray(data.properties) || !Array.isArray(data.applications) || !Array.isArray(data.rounds) || !Array.isArray(data.products))
        throw new Error("shape");
      state = data; save(); render();
      alert("Backup imported.");
    }catch(err){
      alert("That file could not be imported — it is not a valid TurfBook backup. Your current data was not changed.");
    }
  };
  reader.onerror = function(){ alert("Could not read that file. Your current data was not changed."); };
  reader.readAsText(file);
}
function loadDemo(){
  if(!confirm("Replace ALL current data with the demo data?")) return;
  state = demoData(); save(); editingPropId = null; render();
}
function clearDemoOnly(){
  var demo = demoData();
  var propIds = {}; demo.properties.forEach(function(p){ propIds[p.id] = 1; });
  var appIds = {}; demo.applications.forEach(function(a){ appIds[a.id] = 1; });
  var mowIds = {}; demo.mows.forEach(function(m){ mowIds[m.id] = 1; });
  var np = state.properties.filter(function(p){ return propIds[p.id]; }).length;
  var na = state.applications.filter(function(a){ return appIds[a.id] || propIds[a.propId]; }).length;
  var nm = state.mows.filter(function(m){ return mowIds[m.id] || propIds[m.propId]; }).length;
  var n = np + na + nm;
  if(!n){ alert("No demo data found — nothing was removed. Every record in the book is yours."); return; }
  if(!confirm("Clear the demo data only (" + np + " sample properties, " + na + " applications, " + nm + " mows)? Your own properties and records — and your products, rounds, and settings — stay.")) return;
  state.properties = state.properties.filter(function(p){ return !propIds[p.id]; });
  state.applications = state.applications.filter(function(a){ return !(appIds[a.id] || propIds[a.propId]); });
  state.mows = state.mows.filter(function(m){ return !(mowIds[m.id] || propIds[m.propId]); });
  if(editingPropId && propIds[editingPropId]) editingPropId = null;
  save(); render();
}
function clearAll(){
  if(!confirm("Clear ALL data and start with an empty book? Export a backup first if you need this data.")) return;
  var year = new Date().getFullYear();
  state = { settings: defaultSettings(year), rounds: defaultRounds(year), products: defaultProducts(), properties: [], applications: [], mows: [] };
  state.settings.company = "My Lawn Care Co.";
  save(); editingPropId = null; render();
}
